name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Types, Tests, Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./test-report.junit.xml
          disable_search: true
          fail_ci_if_error: false

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Dependency vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Post E2E summary comment
        uses: daun/playwright-report-summary@1229105480a2a4bdd91598d8a146fbab41343fce # v3
        if: always()
        with:
          report-file: test-results/results.json

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Start server and warm up
        run: |
          npm start &
          until curl -sf http://localhost:3000 > /dev/null; do sleep 1; done
          curl -sf http://localhost:3000/ > /dev/null
          curl -sf http://localhost:3000/utilities > /dev/null
          curl -sf http://localhost:3000/utilities/unit-converter > /dev/null
          curl -sf http://localhost:3000/games > /dev/null
          curl -sf http://localhost:3000/games/memory-card > /dev/null

      - name: Run Lighthouse CI
        id: lhci
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: .lighthouserc.json
          temporaryPublicStorage: true
          uploadArtifacts: true

      - name: Post Lighthouse comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          MANIFEST: ${{ steps.lhci.outputs.manifest }}
          LINKS: ${{ steps.lhci.outputs.links }}
        with:
          script: |
            const manifest = JSON.parse(process.env.MANIFEST || '[]')
            const links = JSON.parse(process.env.LINKS || '{}')
            if (!manifest.length) return
            const icon = (v, min) => v >= min ? '🟢' : v >= 0.8 ? '🟡' : '🔴'
            const fmt = v => Math.round(v * 100)
            const rows = manifest.map(r => {
              const url = r.url.replace('http://localhost:3000', '') || '/'
              const s = r.summary
              const report = links[r.url] ? `[Report](${links[r.url]})` : '—'
              return `| \`${url}\` | ${icon(s.performance, 0.8)}${fmt(s.performance)} | ${icon(s.accessibility, 0.9)}${fmt(s.accessibility)} | ${icon(s['best-practices'], 0.9)}${fmt(s['best-practices'])} | ${icon(s.seo, 0.9)}${fmt(s.seo)} | ${report} |`
            })
            const body = [
              '## Lighthouse Results',
              '| URL | Perf | A11y | Best Practices | SEO | Report |',
              '|---|---|---|---|---|---|',
              ...rows,
              '',
              '_Thresholds: Perf ≥ 80 · A11y ≥ 90 · Best Practices ≥ 90 · SEO ≥ 90_'
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('## Lighthouse Results')
            )
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
            }

      - name: Fail if Lighthouse assertions failed
        if: steps.lhci.outcome == 'failure'
        run: |
          echo "Lighthouse CI assertions failed — one or more scores are below threshold."
          exit 1
