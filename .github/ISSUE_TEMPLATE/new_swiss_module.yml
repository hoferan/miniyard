name: 🇨🇭 New Swiss Module
description: Idea for a new Swiss-specific tool, reference, or API explorer
labels: ["new-tool", "swiss"]
body:
  - type: input
    id: name
    attributes:
      label: Module name
      placeholder: "e.g. Swiss Public Holiday Checker, SBB Timetable, Canton Lookup"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What should the module do?
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Module type
      options:
        - Utility (pure logic, no external API)
        - API Explorer (fetches external data)
        - Mixed
    validations:
      required: true
  - type: textarea
    id: data_source
    attributes:
      label: Data source
      placeholder: "e.g. opendata.swiss API, static data, Swiss federal API"
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Requires API key?
      options:
        - No (public / static data)
        - Yes (via .env)
    validations:
      required: true
  - type: dropdown
    id: complexity
    attributes:
      label: Estimated complexity
      options:
        - Small (< 1h)
        - Medium (1–4h)
        - Large (> 4h)
    validations:
      required: true
