name: 🔌 New API Explorer
description: Idea for a new API Explorer / hands-on demo
labels: ["new-tool", "api-explorer"]
body:
  - type: input
    id: api_name
    attributes:
      label: API name
      placeholder: "e.g. OpenWeather, NASA APOD, Exchange Rates"
    validations:
      required: true
  - type: input
    id: api_url
    attributes:
      label: API documentation URL
      placeholder: "https://..."
  - type: textarea
    id: what_to_show
    attributes:
      label: What will be demonstrated?
      placeholder: "Which endpoints? What does the user see?"
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Authentication
      options:
        - None (public)
        - API Key (via .env)
        - OAuth
    validations:
      required: true
  - type: dropdown
    id: complexity
    attributes:
      label: Estimated complexity
      options:
        - Small (< 1h)
        - Medium (1–4h)
        - Large (> 4h)
    validations:
      required: true
