name: 🎮 Neues Minigame
description: Idee für ein neues Minigame
labels: ["new-tool", "minigame"]
body:
  - type: input
    id: name
    attributes:
      label: Name des Spiels
      placeholder: "z.B. Snake, Memory, Reaction Time Test"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Spielidee
      placeholder: "Was ist das Ziel? Wie funktioniert es?"
    validations:
      required: true
  - type: textarea
    id: mechanics
    attributes:
      label: Spielmechanik
      placeholder: |
        - Steuerung: Touch / Klick / Tastatur
        - Gewinnbedingung: ...
        - Verlustbedingung: ...
    validations:
      required: true
  - type: dropdown
    id: input_type
    attributes:
      label: Primäre Steuerung
      options:
        - Touch / Swipe (Mobile-first)
        - Klick / Tap
        - Tastatur
        - Gemischt
    validations:
      required: true
  - type: textarea
    id: scoring
    attributes:
      label: Scoring / Highscore
      placeholder: "Gibt es Punkte? Einen Timer? Einen Highscore?"
  - type: dropdown
    id: complexity
    attributes:
      label: Geschätzte Komplexität
      options:
        - Klein (< 2h)
        - Mittel (2–6h)
        - Gross (> 6h)
    validations:
      required: true
