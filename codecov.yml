coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        branches:
          - "!main"
  individual_components:
    - component_id: module_utilities
      name: utilities
      paths:
        - src/modules/utilities/**
    - component_id: module_games
      name: games
      paths:
        - src/modules/games/**
    - component_id: module_app
      name: app
      paths:
        - src/app/**
        - src/components/**
        - src/lib/**

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
